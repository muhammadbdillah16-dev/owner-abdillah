<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menteri Keuangan Keluarga</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0d2619;
            --card-bg: #133a27;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 30px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .brand-info h2 {
            font-size: 1.1rem;
            color: #facc15;
        }

        .brand-info p {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .btn-manage {
            background-color: #facc15;
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: transform 0.2s;
        }

        .btn-manage:active {
            transform: scale(0.95);
        }

        /* Saldo Main Card */
        .main-card {
            background: linear-gradient(135deg, #15803d, #064e3b);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }

        .main-card h4 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .main-card h1 {
            font-size: 2rem;
            margin: 10px 0 15px 0;
            color: #fff;
        }

        .sub-stats {
            display: flex;
            gap: 10px;
        }

        .stat-box {
            flex: 1;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 12px;
        }

        .stat-box small {
            font-size: 0.7rem;
            color: #cbd5e1;
        }

        .stat-box p {
            font-size: 0.95rem;
            font-weight: bold;
            margin-top: 2px;
        }

        /* Chart Card */
        .chart-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .chart-card h3 {
            font-size: 1rem;
            margin-bottom: 15px;
            align-self: flex-start;
        }

        .chart-container {
            position: relative;
            width: 220px;
            height: 220px;
        }

        /* Form / Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content h3 {
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 0.9rem;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-submit {
            flex: 1;
            background-color: var(--accent-green);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-cancel {
            flex: 1;
            background-color: var(--accent-red);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="brand-info">
                <h2>👑 Menteri Keuangan Keluarga</h2>
                <p>Kelola Anggaran & Masa Depan Bersama</p>
            </div>
            <button class="btn-manage" onclick="openModal()">🔒 Kelola</button>
        </div>

        <!-- Ringkasan Kas -->
        <div class="main-card">
            <h4>Sisa Uang Kas Keluarga</h4>
            <h1 id="txt-sisa">Rp 0</h1>
            <div class="sub-stats">
                <div class="stat-box">
                    <small>Total Pemasukan</small>
                    <p id="txt-pemasukan" style="color: #4ade80;">Rp 0</p>
                </div>
                <div class="stat-box">
                    <small>Total Pengeluaran</small>
                    <p id="txt-pengeluaran" style="color: #f87171;">Rp 0</p>
                </div>
            </div>
        </div>

        <!-- Target & Grafik -->
        <div class="chart-card">
            <h3>Target Investasi & Dana Darurat</h3>
            <div class="chart-container">
                <canvas id="myChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Modal Form Input -->
    <div class="modal" id="modalForm">
        <div class="modal-content">
            <h3>Atur Keuangan</h3>
            
            <label><small>Pemasukan (Rp):</small></label>
            <input type="number" id="inPemasukan" placeholder="Contoh: 5000000">

            <label><small>Pengeluaran (Rp):</small></label>
            <input type="number" id="inPengeluaran" placeholder="Contoh: 2000000">

            <label><small>Target Dana Darurat (Rp):</small></label>
            <input type="number" id="inDarurat" placeholder="Contoh: 3000000">

            <label><small>Target Investasi (Rp):</small></label>
            <input type="number" id="inInvestasi" placeholder="Contoh: 5000000">

            <div class="btn-group">
                <button class="btn-submit" onclick="simpanData()">Simpan</button>
                <button class="btn-cancel" onclick="closeModal()">Batal</button>
            </div>
        </div>
    </div>

    <script>
        let chartInstance = null;

        // Load data awal dari LocalStorage
        let dataKeuangan = JSON.parse(localStorage.getItem('dataKeuangan')) || {
            pemasukan: 10000000,
            pengeluaran: 4000000,
            darurat: 3000000,
            investasi: 3000000
        };

        function formatRupiah(angka) {
            return 'Rp ' + Number(angka).toLocaleString('id-ID');
        }

        function updateUI() {
            let sisa = dataKeuangan.pemasukan - dataKeuangan.pengeluaran;
            document.getElementById('txt-sisa').innerText = formatRupiah(sisa);
            document.getElementById('txt-pemasukan').innerText = formatRupiah(dataKeuangan.pemasukan);
            document.getElementById('txt-pengeluaran').innerText = formatRupiah(dataKeuangan.pengeluaran);

            renderChart();
        }

        function renderChart() {
            const ctx = document.getElementById('myChart').getContext('2d');

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Dana Darurat', 'Investasi'],
                    datasets: [{
                        data: [dataKeuangan.darurat, dataKeuangan.investasi],
                        backgroundColor: ['#f59e0b', '#3b82f6'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#f8fafc' }
                        }
                    }
                }
            });
        }

        function openModal() {
            document.getElementById('inPemasukan').value = dataKeuangan.pemasukan;
            document.getElementById('inPengeluaran').value = dataKeuangan.pengeluaran;
            document.getElementById('inDarurat').value = dataKeuangan.darurat;
            document.getElementById('inInvestasi').value = dataKeuangan.investasi;
            document.getElementById('modalForm').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalForm').style.display = 'none';
        }

        function simpanData() {
            dataKeuangan.pemasukan = Number(document.getElementById('inPemasukan').value) || 0;
            dataKeuangan.pengeluaran = Number(document.getElementById('inPengeluaran').value) || 0;
            dataKeuangan.darurat = Number(document.getElementById('inDarurat').value) || 0;
            dataKeuangan.investasi = Number(document.getElementById('inInvestasi').value) || 0;

            localStorage.setItem('dataKeuangan', JSON.stringify(dataKeuangan));
            updateUI();
            closeModal();
        }

        // Jalankan saat halaman dibuka
        window.onload = function() {
            updateUI();
        };
    </script>
</body>
</html>
